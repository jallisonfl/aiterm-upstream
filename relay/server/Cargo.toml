[package]
name = "aiterm-relay"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
aiterm-relay-protocol = { path = "../protocol" }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util", "signal"] }
url = "2"

[dev-dependencies]
tokio-tungstenite = "0.29"
